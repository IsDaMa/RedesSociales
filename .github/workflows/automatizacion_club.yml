name: Automatización Redes Club Baloncesto (Gemini AI)

on:
  schedule:
    # Se ejecuta todos los lunes a las 08:00 AM UTC (10:00 AM en España)
    - cron: '0 8 * * 1'
    # Opcional: Se ejecuta también los domingos a las 20:00 UTC para crónicas del finde
    - cron: '0 20 * * 0'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Agentes de Contenido con Gemini
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python script_agentes.py

