<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Controlado | CB Social Hub</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#f97316',
              blue: '#2563eb',
              dark: '#0b0f19'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans selection:bg-orange-500 selection:text-white">

  <!-- CONTENEDOR CENTRAL ADAPTATIVO (MÓVIL, TABLET Y ESCRITORIO) -->
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
    
    <!-- Decoración de fondo -->
    <div class="absolute -top-16 -right-16 w-36 h-36 bg-orange-500/10 rounded-full blur-2xl"></div>
    <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-blue-500/10 rounded-full blur-2xl"></div>

    <div class="relative z-10 text-center mb-6">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-500 mx-auto flex items-center justify-center text-3xl shadow-xl shadow-orange-500/25 mb-3">
        🏀
      </div>
      <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight">CB Social Hub</h1>
      <p class="text-xs text-slate-400 mt-1">Acceso restringido para el equipo de comunicación y cuerpo técnico</p>
    </div>

    <!-- MENSAJE DE ERROR -->
    {% if error %}
    <div class="mb-5 bg-red-950/40 border border-red-500/30 text-red-300 text-xs rounded-xl p-3 flex items-center gap-2">
      <i class="fas fa-circle-exclamation text-red-400 text-sm"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- FORMULARIO DE ACCESO SEGURO -->
    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center gap-1.5">
          <i class="fas fa-user text-orange-400"></i> Usuario
        </label>
        <div class="relative">
          <input type="text" id="username" name="username" required autocomplete="username"
            placeholder="Introduce tu usuario" 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center gap-1.5">
          <i class="fas fa-lock text-orange-400"></i> Contraseña
        </label>
        <div class="relative">
          <input type="password" id="password" name="password" required autocomplete="current-password"
            placeholder="••••••••••••" 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition pr-10">
          <button type="button" onclick="togglePassword()" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-200 text-xs">
            <i id="eyeIcon" class="far fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" 
        class="w-full mt-2 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-orange-500/20 transition transform active:scale-[0.99] flex items-center justify-center gap-2 text-sm">
        <i class="fas fa-shield-halved"></i>
        <span>Iniciar Sesión</span>
      </button>
    </form>

    <!-- PIE INFORMATIVO -->
    <div class="mt-6 pt-5 border-t border-slate-800 text-center">
      <div class="flex items-center justify-center gap-1.5 text-[11px] text-slate-400 font-mono">
        <i class="fas fa-lock text-emerald-400 text-xs"></i>
        <span>Sesión encriptada con tokens seguros</span>
      </div>
    </div>

  </div>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'far fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'far fa-eye';
      }
    }
  </script>
</body>
</html>
