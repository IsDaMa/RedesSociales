<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Controlado | CB Cártama Redes</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/webp" href="https://www.cbcartama.com/img/logo.webp">
</head>
<body class="bg-[#050f0a] text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans selection:bg-emerald-600 selection:text-white">

  <!-- CONTENEDOR CENTRAL ADAPTATIVO (MÓVIL, TABLET Y ESCRITORIO) -->
  <div class="w-full max-w-md bg-[#092015] border border-emerald-900/80 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
    
    <!-- Decoración de fondo verde y amarilla -->
    <div class="absolute -top-16 -right-16 w-36 h-36 bg-yellow-500/10 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-emerald-500/15 rounded-full blur-2xl pointer-events-none"></div>

    <div class="relative z-10 text-center mb-6">
      <!-- Escudo Oficial CB Cártama -->
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-emerald-700 via-green-600 to-yellow-500 p-[2px] shadow-xl shadow-emerald-950/80 mx-auto flex items-center justify-center mb-3">
        <div class="w-full h-full bg-[#071910] rounded-[14px] flex items-center justify-center p-1.5">
          <img src="https://www.cbcartama.com/img/logo.webp" alt="CB Cártama Escudo" class="w-14 h-14 object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='🏀';">
        </div>
      </div>
      <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight flex items-center justify-center gap-2">
        <span>CB CÁRTAMA</span>
        <span class="text-xs font-bold px-2 py-0.5 rounded bg-yellow-500/10 text-yellow-400 border border-yellow-500/30">OFICIAL</span>
      </h1>
      <p class="text-xs text-emerald-400/80 mt-1 font-medium">Gestión de Redes Sociales y Publicaciones</p>
      <p class="text-[11px] text-slate-400 mt-0.5">Acceso restringido para el cuerpo técnico y comunicación</p>
    </div>

    <!-- MENSAJE DE ERROR -->
    {% if error %}
    <div class="mb-5 bg-red-950/60 border border-red-500/40 text-red-300 text-xs rounded-xl p-3 flex items-center gap-2">
      <i class="fas fa-circle-exclamation text-red-400 text-sm"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- FORMULARIO DE ACCESO SEGURO -->
    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-emerald-200 mb-1.5 flex items-center gap-1.5">
          <i class="fas fa-user text-yellow-400"></i> Usuario
        </label>
        <div class="relative">
          <input type="text" id="username" name="username" required autocomplete="username"
            placeholder="Usuario del club" 
            class="w-full bg-[#05110a] border border-emerald-900/80 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-emerald-700/60 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-emerald-200 mb-1.5 flex items-center gap-1.5">
          <i class="fas fa-lock text-yellow-400"></i> Contraseña
        </label>
        <div class="relative">
          <input type="password" id="password" name="password" required autocomplete="current-password"
            placeholder="••••••••••••" 
            class="w-full bg-[#05110a] border border-emerald-900/80 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-emerald-700/60 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition pr-10">
          <button type="button" onclick="togglePassword()" class="absolute right-3 top-3.5 text-emerald-500 hover:text-emerald-300 text-xs">
            <i id="eyeIcon" class="far fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" 
        class="w-full mt-2 bg-gradient-to-r from-emerald-600 via-green-600 to-yellow-500 hover:opacity-95 text-slate-950 font-black py-3 px-4 rounded-xl shadow-lg shadow-emerald-950/60 transition transform active:scale-[0.99] flex items-center justify-center gap-2 text-sm">
        <i class="fas fa-shield-halved"></i>
        <span>Acceder al Panel CB Cártama</span>
      </button>
    </form>

    <!-- PIE INFORMATIVO -->
    <div class="mt-6 pt-5 border-t border-emerald-950 text-center">
      <div class="flex items-center justify-center gap-1.5 text-[11px] text-emerald-400/70 font-medium">
        <i class="fas fa-lock text-yellow-400 text-xs"></i>
        <span>Acceso encriptado y registro de auditoría activo</span>
      </div>
    </div>

  </div>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'far fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'far fa-eye';
      }
    }
  </script>
</body>
</html>
